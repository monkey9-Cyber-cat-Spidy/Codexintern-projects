version: '3.8'

services:
  # Pandas Data Analysis Web App
  pandas-analyzer:
    build:
      context: ./slab1-beginners/pandas-data-analysis
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - ./slab1-beginners/pandas-data-analysis/uploads:/app/uploads
      - ./slab1-beginners/pandas-data-analysis/plots:/app/plots
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - codexintern-network

  # Sentiment Analysis Web App  
  sentiment-analyzer:
    build:
      context: ./slab2-intermediate/sentiment-analysis-web
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    volumes:
      - ./slab2-intermediate/sentiment-analysis-web/uploads:/app/uploads
      - ./slab2-intermediate/sentiment-analysis-web/plots:/app/plots
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - codexintern-network

  # House Price Predictor Web App
  house-price-predictor:
    build:
      context: ./slab1-beginners/linear-regression-house-price
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    volumes:
      - ./slab1-beginners/linear-regression-house-price/plots:/app/plots
      - ./slab1-beginners/linear-regression-house-price/models:/app/models
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - codexintern-network

  # Matrix Calculator Web App
  matrix-calculator:
    build:
      context: ./slab1-beginners/matrix-operations-tool
      dockerfile: Dockerfile
    ports:
      - "5004:5004"
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - codexintern-network

networks:
  codexintern-network:
    driver: bridge

volumes:
  pandas_data:
  sentiment_data:
  house_price_data:
  matrix_data: